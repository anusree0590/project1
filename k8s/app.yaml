apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackathon-starter
  namespace: hackathon-starter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hackathon-starter
  template:
    metadata:
      labels:
        app: hackathon-starter
    spec:
      containers:
        - name: hackathon-starter
          image: IMAGE_URI
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: '8080'
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-auth
                  key: MONGO_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-auth
                  key: MONGO_PASSWORD
            - name: MONGODB_HOST
              valueFrom:
                configMapKeyRef:
                  name: mongodb-config
                  key: MONGODB_HOST
            - name: MONGODB_PORT
              valueFrom:
                configMapKeyRef:
                  name: mongodb-config
                  key: MONGODB_PORT
            - name: MONGODB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: mongodb-config
                  key: MONGODB_DATABASE
            - name: MONGODB_URI
              value: 'mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@$(MONGODB_HOST):$(MONGODB_PORT)/$(MONGODB_DATABASE)?authSource=$(MONGODB_DATABASE)'
---
apiVersion: v1
kind: Service
metadata:
  name: hackathon-starter
  namespace: hackathon-starter
spec:
  type: ClusterIP
  selector:
    app: hackathon-starter
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
