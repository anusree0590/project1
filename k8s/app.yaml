apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackathon-starter
  namespace: hackathon-starter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hackathon-starter
  template:
    metadata:
      labels:
        app: hackathon-starter
    spec:
      containers:
        - name: hackathon-starter
          image: IMAGE_URI
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: '8080'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hackathon-starter
  namespace: hackathon-starter
spec:
  type: ClusterIP
  selector:
    app: hackathon-starter
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
